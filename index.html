<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SatapathyOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(255,255,255,.78); --glass-strong:rgba(255,255,255,.92); --ink:#14213d; --muted:#56627e; --line:rgba(20,33,61,.12);
  --accent:#3b6cf6; --chip:rgba(20,33,61,.06);
  --bar:rgba(12,18,38,.45); --dock:rgba(255,255,255,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--glass:rgba(22,30,56,.78);--glass-strong:rgba(22,30,56,.94);--ink:#e8ecf6;--muted:#9aa6c2;--line:rgba(255,255,255,.12);--accent:#86a3ff;--chip:rgba(255,255,255,.08);--dock:rgba(10,15,32,.45)}
}
:root[data-theme="dark"]{--glass:rgba(22,30,56,.78);--glass-strong:rgba(22,30,56,.94);--ink:#e8ecf6;--muted:#9aa6c2;--line:rgba(255,255,255,.12);--accent:#86a3ff;--chip:rgba(255,255,255,.08);--dock:rgba(10,15,32,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:400 14.5px/1.6 "IBM Plex Sans",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;
  background:radial-gradient(60% 55% at 15% 20%,#3a4fd8 0,transparent 70%),radial-gradient(50% 50% at 85% 25%,#0fb5ae 0,transparent 70%),radial-gradient(70% 60% at 60% 95%,#7a3fd1 0,transparent 70%),#0d1530;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}

/* top bar */
#top{position:fixed;inset:0 0 auto;height:calc(34px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;justify-content:space-between;background:var(--bar);backdrop-filter:blur(18px);z-index:9000;font-size:13px}
#top .l{display:flex;align-items:center;gap:14px}
#launch{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;padding:2px 8px;border-radius:6px}
#launch:hover{background:rgba(255,255,255,.15)}
#top .r{display:flex;align-items:center;gap:12px}
#theme{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
#theme:hover{background:rgba(255,255,255,.15)}

/* desktop icons */
#desk{position:absolute;top:calc(48px + env(safe-area-inset-top,0px));left:14px;bottom:110px;display:flex;flex-direction:column;flex-wrap:wrap;gap:8px;align-content:flex-start}
.dicon{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:12px;text-align:center;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dicon:hover{background:rgba(255,255,255,.14)}
.tile{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.tile svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* windows */
.win{position:absolute;display:none;flex-direction:column;background:var(--glass);color:var(--ink);backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);max-width:calc(100vw - 16px);max-height:calc(100dvh - 150px);overflow:hidden}
.win.open{display:flex}
.win.max{left:8px!important;top:calc(42px + env(safe-area-inset-top,0px))!important;width:calc(100vw - 16px)!important;height:calc(100dvh - 130px - env(safe-area-inset-top,0px))!important;max-height:none}
.bar{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;cursor:grab;user-select:none;touch-action:none;border-bottom:1px solid var(--line)}
.bar:active{cursor:grabbing}
.lights{display:flex;gap:7px}
.lights button{width:13px;height:13px;border-radius:50%;padding:0}
.lights .c{background:#ff5f57}.lights .m{background:#febc2e}.lights .x{background:#28c840}
.bar b{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:600;flex:1;text-align:center;padding-right:46px}
.body{padding:22px 24px 26px;overflow:auto;flex:1}
.body h2{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;line-height:1.15;letter-spacing:-.02em;margin-bottom:12px}
.body p{color:var(--muted);margin-bottom:12px;max-width:62ch}
.body h3{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none}
.chips li{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px}
.tl{list-style:none;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 20px 22px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tl b{display:block;font-weight:500;font-size:15.5px}.tl span{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.proj{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:14px}
.proj b{display:block;font-weight:500}.proj span{color:var(--muted);font-size:13px}
.proj.d{border-left:3px solid #e9a23b}.proj.a{border-left:3px solid var(--accent)}
.links a{display:block;padding:13px 15px;margin-bottom:10px;background:var(--chip);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;overflow-wrap:anywhere}
.links a:hover{border-color:var(--accent)}
.links small{display:block;color:var(--muted);font-size:12.5px}

/* dock */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding:9px 12px;background:var(--dock);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.22);border-radius:24px;z-index:9000}
#dock button{position:relative;padding:0;transition:transform .15s}
#dock button:hover{transform:translateY(-5px) scale(1.08)}
#dock button.on::after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff}

/* launcher */
#menu{position:fixed;left:10px;top:calc(40px + env(safe-area-inset-top,0px));width:250px;display:none;padding:8px;background:var(--glass-strong);color:var(--ink);backdrop-filter:blur(26px);border:1px solid var(--line);border-radius:14px;z-index:9500;box-shadow:0 24px 50px -16px rgba(0,0,0,.6)}
#menu.open{display:block}
#menu button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
#menu button:hover{background:var(--chip)}
#menu .tile{width:30px;height:30px;border-radius:9px;box-shadow:none}#menu .tile svg{width:17px;height:17px}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

@media (max-width:640px){#desk{display:none}.win{max-width:calc(100vw - 12px)}.bar b{padding-right:46px}}
@media (prefers-reduced-motion:reduce){#dock button{transition:none}}
</style>
</head>
<body>
<div id="top">
  <div class="l"><button id="launch" aria-haspopup="true" aria-expanded="false">SatapathyOS</button></div>
  <div class="r"><button id="theme" aria-label="Toggle light and dark">◐</button><span id="clock"></span></div>
</div>
<div id="menu" role="menu"></div>
<div id="desk"></div>
<div id="wins"></div>
<div id="dock"></div>

<script>
const IC={
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  edu:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'
};
const chips=a=>'<ul class="chips">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const sk=(t,a)=>'<h3>'+t+'</h3>'+chips(a);
const proj=(n,s,k)=>'<div class="proj '+k+'"><b>'+n+'</b><span>'+s+'</span></div>';
const APPS=[
 {id:'about',t:'About Me',i:'user',g:'#4f6df5,#7a3fd1',w:460,x:90,y:70,c:
  '<h2>Debabrata Satapathy</h2><p>Java backend developer and data analyst based in Kendrapara, Odisha. I build scalable REST services with Spring Boot, Hibernate/JPA and MySQL, and I move up the stack into React when a project needs one person to own it end to end.</p><p>Currently working on enterprise-grade e-commerce architecture: auth, catalog, cart, orders and payments, secured with OAuth2 and JWT.</p><p>I also analyse data with Python, SQL and Excel, finding trends and presenting them in clear visuals.</p>'},
 {id:'skills',t:'Skills',i:'cpu',g:'#0fb5ae,#2f7fd8',w:480,x:150,y:100,c:
  sk('Backend',['Java','Spring Boot','Spring Security','REST APIs','Hibernate &amp; JPA','JDBC','Servlet &amp; JSP'])+sk('Database',['MySQL','SQL'])+sk('Frontend',['HTML','CSS','JavaScript','React'])+sk('Data &amp; analytics',['Python','Pandas','NumPy','Matplotlib','Seaborn','EDA','Data cleaning','Trend analysis','Statistics','Hypothesis testing'])+sk('Excel',['Pivot tables','VLOOKUP','Conditional formatting','Charts &amp; formulas'])+sk('Tools',['Git &amp; GitHub','Docker','JUnit','Jupyter','Google Colab','VS Code'])},
 {id:'edu',t:'Education',i:'edu',g:'#e9a23b,#e0603b',w:460,x:210,y:90,c:
  '<h2>Education</h2><ol class="tl"><li><b>Java Backend Development</b><span>Masai School, Bengaluru · 2022–2023</span></li><li><b>Master of Computer Application</b><span>Lovely Professional University, Phagwara · 2021–2022</span></li><li><b>Bachelor of Computer Application</b><span>Institute of Professional Studies and Research, Cuttack · 2018–2021</span></li></ol>'},
 {id:'proj',t:'Projects',i:'folder',g:'#3b82f6,#06b6d4',w:520,x:260,y:80,c:
  '<h2>Projects</h2><div class="grid">'+proj('Online Sweet Mart','Backend app','a')+proj('HRMS','HR management','a')+proj('Complaint Management System','Backend app','a')+proj('Jiomart Clone','E-commerce','a')+proj('Tmetric Clone','Time tracking','a')+proj('Heart Disease Analysis','Data analysis','d')+proj('GDP Analysis','Data analysis','d')+'</div>'},
 {id:'contact',t:'Contact',i:'mail',g:'#ec4899,#f97316',w:400,x:320,y:110,c:
  '<h2>Get in touch</h2><div class="links"><a href="mailto:satapathy20001@gmail.com"><small>Email</small>satapathy20001@gmail.com</a><a href="tel:+918249084184"><small>Phone</small>+91 82490 84184</a><a href="https://github.com/3dharmadev" target="_blank" rel="noopener"><small>GitHub</small>github.com/3dharmadev</a></div>'}
];
const $=s=>document.querySelector(s);
const tile=a=>'<span class="tile" style="background:linear-gradient(135deg,'+a.g.split(',')[0]+','+a.g.split(',')[1]+')"><svg viewBox="0 0 24 24">'+IC[a.i]+'</svg></span>';
let z=10;
APPS.forEach(a=>{
  $('#desk').insertAdjacentHTML('beforeend','<button class="dicon" data-a="'+a.id+'">'+tile(a)+'<span>'+a.t+'</span></button>');
  $('#dock').insertAdjacentHTML('beforeend','<button data-a="'+a.id+'" title="'+a.t+'" aria-label="'+a.t+'">'+tile(a)+'</button>');
  $('#menu').insertAdjacentHTML('beforeend','<button role="menuitem" data-a="'+a.id+'">'+tile(a)+a.t+'</button>');
  $('#wins').insertAdjacentHTML('beforeend','<section class="win" id="w-'+a.id+'" style="left:'+a.x+'px;top:'+a.y+'px;width:'+a.w+'px" aria-label="'+a.t+'"><div class="bar"><div class="lights"><button class="x" data-do="close" aria-label="Close"></button><button class="m" data-do="min" aria-label="Minimize"></button><button class="c" data-do="max" aria-label="Maximize"></button></div><b>'+a.t+'</b></div><div class="body">'+a.c+'</div></section>');
});
$('#menu').insertAdjacentHTML('beforeend','<hr><button id="shut" role="menuitem"><span style="width:30px;text-align:center">⏻</span>Restart</button>');

function focusWin(w){w.style.zIndex=++z;document.querySelectorAll('.win').forEach(x=>x.dataset.top=x===w?1:0)}
function sync(){APPS.forEach(a=>{const w=$('#w-'+a.id);$('#dock [data-a="'+a.id+'"]').classList.toggle('on',w.classList.contains('open'))})}
function openApp(id){
  const w=$('#w-'+id);
  if(w.classList.contains('open')&&w.dataset.top==='1'&&!w.dataset.fromMenu){w.classList.remove('open')}
  else{w.classList.add('open');focusWin(w)}
  sync();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b){openApp(b.dataset.a);$('#menu').classList.remove('open');$('#launch').setAttribute('aria-expanded','false');return}
  const d=e.target.closest('[data-do]');
  if(d){const w=d.closest('.win');
    if(d.dataset.do==='max')w.classList.toggle('max');else{w.classList.remove('open');if(d.dataset.do==='close')w.classList.remove('max')}
    sync();return}
  if(e.target.closest('#shut')){APPS.forEach(a=>$('#w-'+a.id).classList.remove('open','max'));sync();$('#menu').classList.remove('open');return}
  if(!e.target.closest('#menu')&&!e.target.closest('#launch'))$('#menu').classList.remove('open');
});
$('#launch').onclick=()=>{const m=$('#menu');m.classList.toggle('open');$('#launch').setAttribute('aria-expanded',m.classList.contains('open'))};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#menu').classList.remove('open')});

/* dragging */
document.querySelectorAll('.win').forEach(w=>{
  w.addEventListener('pointerdown',()=>focusWin(w));
  const bar=w.querySelector('.bar');let sx,sy,ox,oy,drag=false;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||w.classList.contains('max'))return;
    drag=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;bar.setPointerCapture(e.pointerId)});
  bar.addEventListener('pointermove',e=>{
    if(!drag)return;
    const nx=Math.min(Math.max(ox+e.clientX-sx,-w.offsetWidth+80),innerWidth-80);
    const ny=Math.min(Math.max(oy+e.clientY-sy,36),innerHeight-90);
    w.style.left=nx+'px';w.style.top=ny+'px'});
  bar.addEventListener('pointerup',()=>drag=false);
  bar.addEventListener('dblclick',e=>{if(!e.target.closest('button'))w.classList.toggle('max')});
});

/* clock + theme */
function tick(){$('#clock').textContent=new Date().toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}
tick();setInterval(tick,30000);
$('#theme').onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark'};

/* start with About open */
if(innerWidth<=640){const a=$('#w-about');a.style.left='6px';a.style.top='48px';a.style.width='calc(100vw - 12px)'}
openApp('about');
</script>
</body>
</html>
